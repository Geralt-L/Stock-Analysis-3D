# Physical AI / Kosmo / 禾赛机器人业务 / 汽车出清 —— 监控指标清单
# 用法：每季度（或在 frequency 指定的节点）逐项更新 current，若触及 threshold_positive / threshold_negative 则在 alerts 中记录。
# 生成日期 2026-09-03；配套说明见 research/2026-09-03-memory-cycle-inflection-and-hesai-sotp.md 第 7 节。
version: 1
as_of: "2026-09-03"
review_cadence: quarterly
groups:
  - id: A
    name: Physical AI 需求拐点（类比存储 2023-05 Nvidia 时刻）
    indicators:
      - id: A1
        name: 全球人形机器人年出货（多机构口径）
        current: "2026H1: SAG 1.91万台(+272%) / Counterpoint >2.2万台; 2026全年预测 5–7.5万台; 禾赛管理层 2027 >10万台"
        threshold_positive: "连续两个半年报年化 >10万台，且 ≥3 家机构口径差 <20%"
        threshold_negative: "2026 全年 <5 万台，或 2027 增速 <50%"
        sources: ["https://smartanalyticsglobal.com", "https://counterpointresearch.com", "https://www.trendforce.com/presscenter", "IDC/Omdia 年报"]
        frequency: semiannual (Feb/Aug)
      - id: A2
        name: 付费商业/工业客户占比与复购
        current: "SAG 2026H1 工业+商用 >70%（方法论未公开）；宇树 2025 人形收入 73.6% 来自高校科研；优必选大单多为政府数采中心"
        threshold_positive: "≥3 家非关联工业客户公开第二批 ≥100 台复购订单，且行业追踪显示付费商业占比 >50% 并附方法论"
        threshold_negative: "复购订单缺失，新增订单仍以科研/政府为主"
        sources: ["上市公司财报与大单公告", "SAG/Counterpoint"]
        frequency: quarterly
      - id: A3
        name: 头部厂商单位经济（宇树 688836 / 优必选 9880.HK / 智元招股书）
        current: "优必选 2026H1 营收 12.69亿 (+104%)、毛利率 44.7%、亏损 3.39亿，全尺寸 ASP ≈64万元；宇树 2026H1 营收 11.52亿、归母净利 2.74亿；智元港股 IPO 目标 HK$400–500亿"
        threshold_positive: "优必选经调整 EBITDA 转正且全尺寸人形毛利率 >30%；宇树在人形 ASP 年降 >20% 时净利率仍 >15%"
        threshold_negative: "任一头部厂商毛利率跌破 20%"
        frequency: semiannual
      - id: A4
        name: Tesla Optimus 产量披露与外销
        current: "截至 2026-07 电话会无产量数字；报道称 Fremont 已开产、外销最早 2027H2"
        threshold_positive: "季度产量 >2,500 台或宣布首个外部付费客户"
        threshold_negative: "2026Q4 电话会仍无产量数字"
        frequency: quarterly
      - id: A5
        name: 付费部署运行小时 / 机队规模 / RaaS 价格
        current: "Agility 累计 >65,000 小时、9 个现场、>US$3亿多年预订（≈1,000 台）；Figure 03 在 BMW 单台；Sharpa North 上海 DQ 12 小时/天"
        threshold_positive: "单客户 ≥100 台机队、可用率 >90%、>2,000 小时/台/年；RaaS 月费 < 当地人工全成本"
        frequency: quarterly
      - id: A6
        name: 卖方出货预测修订方向
        current: "2026 年内多次上修：MS 中国 1.4→2.8→5 万台；Goldman 全球 5.1→7.5 万台（2026-08-31）"
        threshold_positive: "2026 实际落在 5–7.5 万带内且 2027 预测继续上修"
        threshold_negative: "2026 实际 <5 万后卖方下修 2027（对应存储周期的预测下修—资本投降阶段）"
        frequency: quarterly
      - id: A7
        name: 通用 VLA 陌生环境泛化（GPT 时刻判据）
        current: "π0.7 组合泛化；Gemini Robotics 2 <200 样本适配新本体；GR00T N2 预告新环境成功率 2x（年底发布）；无公开策略达 80%"
        threshold_positive: "RoboArena 类分布式真机榜单第一策略在未见任务+未见环境成功率 ≥80%"
        threshold_negative: "2027 年底仍 <60%"
        frequency: quarterly / per model release
      - id: A8
        name: 一级市场融资与资本投降信号
        current: "人形 2026YTD 融资 US$86亿 > 2025 全年 US$61亿；宇树上市 11 日较高点 -50%；K-Scale 倒闭；Sharpa 投后 RMB 220亿"
        threshold_positive: "投降后复苏：季度融资同比 -50%、≥3 起 down-round → 随后出货突破"
        threshold_negative: "单季 >US$100 亿（过热）"
        frequency: monthly
      - id: A9
        name: 美国对华机器人壁垒
        current: "FCC 2026-07-28 禁新进口中国人形/四足；宇树、速腾入 1260H；Section 232 机器人调查未裁定"
        threshold_negative: "232 对机器人/部件加税 ≥25%，或 FCC 将激光雷达/执行器纳入 Covered List（直接冲击禾赛）"
        threshold_positive: "豁免或条件批准清单"
        frequency: monthly
